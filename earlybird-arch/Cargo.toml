[package]
name = "earlybird-arch"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
fastembed = { version = "7.5", features = ["qwen3", "hf-hub-native-tls"] }
candle-core = "0.11"
qdrant-client = "1.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
petgraph = "0.7"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "point_series", "area_series"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
open = "5.3"

[profile.dev]
opt-level = 2


