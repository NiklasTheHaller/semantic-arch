- id: "RAW-01"
  source_ids: [1]
  section: "Company Products and Services"
  kind: "constraint"
  text: "We guarantee breakfast delivery in less than 25 minutes to all parts of the city."

- id: "RAW-02"
  source_ids: [2]
  section: "Company Products and Services"
  kind: "functional"
  text: "We offer a number of prepackaged breakfasts like the mini-breakfast (one croissant, one coffee), the luxury breakfast (one croissant, one glass of orange juice, two kinds of jam, ham and eggs, one cup of coffee) and many more."

- id: "RAW-03"
  source_ids: [3]
  section: "Company Products and Services"
  kind: "functional"
  text: "Of course, our customers can also assemble an individual breakfast to their taste by choosing from a long list of simple products (croissant, orange juice, butter, …)."

- id: "RAW-04"
  source_ids: [4]
  section: "Company Products and Services"
  kind: "domain-rule"
  text: "A prepackaged product may contain simple products, but also other prepackaged products."

- id: "RAW-05"
  source_ids: [5]
  section: "Company Products and Services"
  kind: "domain-rule"
  text: "So, a typical order consists of various amounts of various products (prepackaged ones and/or simple ones)."

- id: "RAW-06"
  source_ids: [6]
  section: "Company Products and Services"
  kind: "domain-rule"
  text: "Each product has a unit (e.g. 100 grams) and a price per unit denominated in Euros."

- id: "RAW-07"
  source_ids: [7]
  section: "Placing an Order on the Phone"
  kind: "constraint"
  text: "Currently, our customers can place orders only over the phone."

- id: "RAW-08"
  source_ids: [8]
  section: "Placing an Order on the Phone"
  kind: "functional"
  text: "To do so, they call our company number 384 29 734 and tell us their customer number."

- id: "RAW-09"
  source_ids: [9]
  section: "Placing an Order on the Phone"
  kind: "domain-rule"
  text: "A customer number has seven digits that are preceded by a two-digit area code and followed by a one digit checksum."

- id: "RAW-10"
  source_ids: [10]
  section: "Placing an Order on the Phone"
  kind: "domain-rule"
  text: "There are no collective orders of several customers."

- id: "RAW-11"
  source_ids: [11]
  section: "Placing an Order on the Phone"
  kind: "functional"
  text: "After the phone clerk has authenticated the customer (which includes checking that he is not blacklisted e.g. due to bad payment morale) the customer names one or several products to be added to the shopping cart."

- id: "RAW-12"
  source_ids: [12]
  section: "Placing an Order on the Phone"
  kind: "functional"
  text: "If the customer is not sure about certain products, she can tell the phone clerk the desired characteristics (e.g. less than 300 calories and less than € 4) and gets a choice of suitable products to pick from."

- id: "RAW-13"
  source_ids: [13]
  section: "Placing an Order on the Phone"
  kind: "functional"
  text: "The customer can also decide to simply place a follow-up-order by naming one of her previous orders, which serves as a blueprint for the new order."

- id: "RAW-14"
  source_ids: [14]
  section: "Placing an Order on the Phone"
  kind: "functional"
  text: "Those three methods of assembling the shopping cart (direct naming of products, choosing from a list of suitable products presented by the phone clerk, naming an order as a blueprint) can be combined within placing one order."

- id: "RAW-15"
  source_ids: [15]
  section: "Placing an Order on the Phone"
  kind: "domain-rule"
  text: "However, an order can only have one blueprint order at most."

- id: "RAW-16"
  source_ids: [16]
  section: "Placing an Order on the Phone"
  kind: "domain-rule"
  text: "One order can serve as a blueprint many times."

- id: "RAW-17"
  source_ids: [17]
  section: "Placing an Order on the Phone"
  kind: "functional"
  text: "For each customer, only one address is predefined. Therefore, there is no need to specify a delivery address when ordering. The process ends by the phone clerk informing the customer about the order number, which is an eight-digit number with a checksum."

- id: "RAW-18"
  source_ids: [18]
  section: "Packaging an Order"
  kind: "functional"
  text: "A packing clerk looks at each order, assembles the ordered products and puts them into a paper bag."

- id: "RAW-19"
  source_ids: [19]
  section: "Packaging an Order"
  kind: "functional"
  text: "Using an ordinary text processing system, the packing clerk prints a label with his own name, the first name of the customer, the surname of the customer, the address, the order number and the delivery clerk he assigned to the order."

- id: "RAW-20"
  source_ids: [20]
  section: "Packaging an Order"
  kind: "functional"
  text: "The label is attached to the paper bag."

- id: "RAW-21"
  source_ids: [21]
  section: "Packaging an Order"
  kind: "functional"
  text: "Also, the packing clerk prints an invoice twice with the text processing system."

- id: "RAW-22"
  source_ids: [22]
  section: "Packaging an Order"
  kind: "functional"
  text: "The invoice shows the same data as the label plus the individual ordered products, their amounts and prices and the sum total."

- id: "RAW-23"
  source_ids: [23]
  section: "Packaging an Order"
  kind: "domain-rule"
  text: "If an invoice is printed several times, each copy gets a separate number."

- id: "RAW-24"
  source_ids: [24]
  section: "Delivering an Order"
  kind: "functional"
  text: "The delivery clerk calculates the optimal itinerary, often using an ordinary spreadsheet. This is important as many orders may be fulfilled within one itinerary."

- id: "RAW-25"
  source_ids: [25]
  section: "Delivering an Order"
  kind: "functional"
  text: "The delivery clerk prints out the optimal itinerary, takes the corresponding bags and invoices and drives to the corresponding customers."

- id: "RAW-26"
  source_ids: [26]
  section: "Delivering an Order"
  kind: "functional"
  text: "Each customer confirms delivery by signing a copy of the invoice. She keeps the other copy."

- id: "RAW-27"
  source_ids: [27]
  section: "Status Inquiry"
  kind: "functional"
  text: "Each customer can inquire into the status of her order over the phone using the order number. The phone clerk then tells the customer whether the delivery clerk is already on his way or not."

- id: "RAW-28"
  source_ids: [28]
  section: "Canceling an Order"
  kind: "functional"
  text: "Canceling an order is possible by calling the phone clerk and naming the order number."

- id: "RAW-29"
  source_ids: [29]
  section: "Canceling an Order"
  kind: "domain-rule"
  text: "Once the order has been assembled, canceling is not possible anymore."

- id: "RAW-30"
  source_ids: [30]
  section: "Canceling an Order"
  kind: "domain-rule"
  text: "A cancelation cannot be undone."

- id: "RAW-31"
  source_ids: [31]
  section: "Canceling an Order"
  kind: "domain-rule"
  text: "Updating of orders is not possible. If the customer wants to change an order, she has to cancel it and place a new order."

- id: "RAW-32"
  source_ids: [32]
  section: "Automation of Existing Processes"
  kind: "functional"
  text: "We want the current process to be automated (but not changed) by a web-based application. The application replaces the current ordering by phone which will be discontinued. It also replaces the text processing system used for labeling and the tools used for calculating and printing the optimal itinerary."

- id: "RAW-33"
  source_ids: [33]
  section: "Automation of Existing Processes"
  kind: "constraint"
  text: "The application is supposed to support the following browsers in the following versions: modern web browsers."

- id: "RAW-34"
  source_ids: [34]
  section: "Automation of Existing Processes"
  kind: "domain-rule"
  text: "The user groups are: customers, packing clerks, delivery clerks and managers. There will be no phone clerks in the future."

- id: "RAW-35"
  source_ids: [35]
  section: "Automation of Existing Processes"
  kind: "functional"
  text: "The confirmation of the delivery by the customer should also be browser-based: The delivery clerk presents a smartphone to the customer who enters her password in a browser window to confirm the delivery."

- id: "RAW-36"
  source_ids: [36]
  section: "Automation of Existing Processes"
  kind: "functional"
  text: "The software should offer a browser-based product search function that requires no authentication. The product search also replaces having the phone clerk list suitable products."

- id: "RAW-37"
  source_ids: [37]
  section: "Placing and Canceling an Order by Text Message"
  kind: "functional"
  text: "In the future, customers can also order by text messages (SMS). In this case they send a defined string to our company number 384 29 734. The string looks like this: C 2339110045 W mypswd P EGG 1 P TOAST 2 P OJUICE 1. This represents an order of the customer with the customer number 2339110045 having the password mypswd. The order is for one egg, two toasts and one glass of orange juice."

- id: "RAW-38"
  source_ids: [38]
  section: "Placing and Canceling an Order by Text Message"
  kind: "domain-rule"
  text: "Each product has a unique product code as shown above."

- id: "RAW-39"
  source_ids: [39]
  section: "Placing and Canceling an Order by Text Message"
  kind: "domain-rule"
  text: "The string may contain any number of products but is naturally limited by the length text messages can have in general."

- id: "RAW-40"
  source_ids: [40]
  section: "Placing and Canceling an Order by Text Message"
  kind: "functional"
  text: "The system responds with a text message specifying the order number the system has assigned to the order."

- id: "RAW-41"
  source_ids: [41]
  section: "Placing and Canceling an Order by Text Message"
  kind: "functional"
  text: "Canceling by text message should be possible by sending a text message of the form O 261273842 to the above number. In the example, the order with the order number 261273842 is canceled."

- id: "RAW-42"
  source_ids: [42]
  section: "Payment"
  kind: "functional"
  text: "We have a payment system already in place. It receives interface records for expected payments. The interface record comprises the customerNumber, the orderNumber, the amountInEuros and the expected payment date."

- id: "RAW-43"
  source_ids: [43]
  section: "Payment"
  kind: "functional"
  text: "Once the packing clerk has finished assembling an order, a record representing an expected payment for the order should be transferred to the payment system."

- id: "RAW-44"
  source_ids: [44]
  section: "Business Reporting"
  kind: "functional"
  text: "The system is supposed to print a business report for the manager every night automatically that lists the orders of a given day along with the product, the amount, the packing clerk and the delivery clerk, the customer, the customer’s address and the order number."
